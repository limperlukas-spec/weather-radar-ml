[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "weather-radar-ml"
version = "0.1.0"
description = "A reproducible research framework for benchmarking radar-based weather forecasting strategies."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "Apache-2.0"
authors = [
  { name = "Lukas Limper" },
]
dependencies = [
  "hydra-core>=1.3.6,<2",
  "mlflow>=3.15.2,<4",
]

[project.scripts]
weather-radar-ml = "weather_radar_ml.entrypoints.run:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "mypy>=1.17,<2",
  "mutmut>=3.3,<4",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/weather_radar_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=weather_radar_ml",
  "--cov-report=term-missing",
  "--cov-report=xml",
  "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true
source = ["weather_radar_ml"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["weather_radar_ml"]
warn_unused_configs = true

[tool.mutmut]
paths_to_mutate = ["src/weather_radar_ml/"]
tests_dir = ["tests/"]
